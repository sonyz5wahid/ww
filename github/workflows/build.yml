name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Siapkan font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-liberation2 fonts-crosextra-carlito fonts-crosextra-caladea
          mkdir -p app/src/main/assets/fonts
          find /usr/share/fonts -type f \( -iname 'Liberation*-*.ttf' -o -iname 'Carlito-*.ttf' -o -iname 'Caladea-*.ttf' \) -exec cp {} app/src/main/assets/fonts/ \;
          ls -l app/src/main/assets/fonts
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: WahidWord-APK
          path: app/build/outputs/apk/debug/app-debug.apk
